\* THE SHIPPED COMBINER PROTOCOL as MV2 pins it, with a process able to DIE at
\* every step of a combine round. Every invariant must HOLD and `AllSettled` --
\* the no-lost-request / no-deadlock half -- must hold too.
\*
\* `AllowStall = FALSE` here: this configuration is about DEATH. The harder
\* false-positive-steal case (descheduled, stolen from, then resurrected onto a
\* round it no longer owns) is `shm_lease_combine_stall_MC.cfg`.
SPECIFICATION Spec

CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
    Want <- WantDef
    Capacity = 2
    MaxEpochs = 5
    MaxFaults = 1
    IdempotentPublish = TRUE
    BudgetIsCache = TRUE
    SerialisePerSlot = TRUE
    AllowSteal = TRUE
    StealFromLive = FALSE
    AllowStall = FALSE
    CommitFencedByRole = TRUE
    CountOwnProposals = TRUE

INVARIANTS
    TypeOK
    EpochBoundNotBinding
    NoDoubleGrant
    GrantCoherent
    NoOvercommit
    NonNegative
    BudgetExact
    GrantedEqualsTaken
    StealResolvesExactlyOnce
    NeverBoth
    NoDiscardOfCollected

PROPERTIES
    AllSettled
