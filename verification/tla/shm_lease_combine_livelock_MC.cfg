\* FINDING: AN UNSOUND STEAL DETECTOR COSTS LIVENESS, NOT SAFETY.
\*
\* `StealFromLive = TRUE` lets the timeout fire on a combiner that is RUNNING.
\* TLC MUST REPORT A VIOLATION of `EpochBoundNotBinding`: two live processes
\* steal the role from each other without bound, and the epoch counter runs away.
\*
\* Read this next to `shm_lease_combine_live_MC.cfg`, which runs the SAME
\* constants and finds every safety invariant intact over 1,325,806 states. The
\* pair is the statement: the epoch stamps make a wrongly stolen-from combiner
\* HARMLESS, and the anchor check (boot id + pid + start time) and the bounded
\* timeout are there for PROGRESS. That is a real division of labour and it is
\* worth knowing which mechanism is buying which property before M7 tunes one.
SPECIFICATION Spec


CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
    Want <- WantDef
    Capacity = 2
    MaxEpochs = 5
    MaxFaults = 1
    IdempotentPublish = TRUE
    BudgetIsCache = TRUE
    SerialisePerSlot = TRUE
    AllowSteal = TRUE
    StealFromLive = TRUE
    AllowStall = TRUE
    CommitFencedByRole = TRUE
    CountOwnProposals = TRUE

INVARIANTS
    EpochBoundNotBinding
