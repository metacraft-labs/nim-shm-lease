\* TWO FAULTS, so BOTH processes may be killed or descheduled, and the round
\* that recovers a dead combiner's work may ITSELF be abandoned. This is the
\* configuration that reaches NESTED FAILURE: an abandoned round discarded by a
\* stealer that then dies before committing its own, and a committed round
\* completed by a THIRD acquisition rather than by the process that committed it.
\*
\* It is also why the recovery step is written as a STATELESS, IDEMPOTENT sweep
\* of the ledger rather than as "recover the previous epoch". Recovering the
\* previous epoch does not compose: a stealer that dies while recovering leaves
\* two epochs to recover, and the next stealer would have to know how many.
\* Sweeping the ledger has no such recursion, and this run is where that matters.
SPECIFICATION Spec

CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
    Want <- WantDef
    Capacity = 2
    MaxEpochs = 5
    MaxFaults = 2
    IdempotentPublish = TRUE
    BudgetIsCache = TRUE
    SerialisePerSlot = TRUE
    AllowSteal = TRUE
    StealFromLive = FALSE
    AllowStall = TRUE
    CommitFencedByRole = TRUE
    CountOwnProposals = TRUE

INVARIANTS
    TypeOK
    EpochBoundNotBinding
    NoDoubleGrant
    GrantCoherent
    NoOvercommit
    NonNegative
    BudgetExact
    GrantedEqualsTaken
    StealResolvesExactlyOnce
    NeverBoth
    NoDiscardOfCollected

PROPERTIES
    AllSettled
