\* MUTATION: NO STEAL PROTOCOL. A combiner dies holding the role and the role
\* word is never recovered, so admission is wedged for every other process on
\* the host -- the precise failure the transport spec calls out as what makes
\* crash safety "where the real design work is".
\*
\* TLC MUST REPORT `Deadlock reached`: the wedged state has NO SUCCESSOR AT ALL.
\* Note this is a DEADLOCK rather than an invariant violation, and that is the
\* honest signal -- every safety invariant still holds in the wedged state, which
\* is exactly why a safety-only model of a combiner would have passed this and
\* proved nothing.
SPECIFICATION Spec


CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
    Want <- WantDef
    Capacity = 2
    MaxEpochs = 5
    MaxFaults = 1
    IdempotentPublish = TRUE
    BudgetIsCache = TRUE
    SerialisePerSlot = TRUE
    AllowSteal = FALSE
    StealFromLive = FALSE
    AllowStall = TRUE
    CommitFencedByRole = TRUE
    CountOwnProposals = TRUE

INVARIANTS
    TypeOK
    NoDoubleGrant
    GrantCoherent
    NoOvercommit
