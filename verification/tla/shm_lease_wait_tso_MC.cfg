\* THE :first_target: QUESTION, under an EXPLICIT one-pair store-buffer
\* abstraction of x86-TSO: `bumpAndWake`/`publishGrant` RELEASE-store the value
\* and then SEQ-CST load `waiters`, and a release store may sit in the store
\* buffer past a later load on TSO.
\*
\* TLC IS EXPECTED TO REPORT A VIOLATION of `NoLostWakeup`. READ THE CAVEAT IN
\* verification/README.md BEFORE QUOTING THIS: on its own it shows only that the
\* window is REACHABLE under a hand-built approximation of one memory model for
\* one pair. It is NOT by itself an authoritative statement about x86-TSO -- that
\* is herd7's job. What it does establish is that the window is not excluded by
\* the PROTOCOL, so whether it is excluded at all rests entirely on the
\* architecture -- which is exactly what `:first_target:` suspects and exactly
\* what the code's docstring claims instead.
\*
\* AND HERD7 DID RUN HERE, IN THIS SAME COMMIT: herdtools7 7.58, built from
\* source through opam by `verification/litmus/get-herd7.sh` because nixpkgs has
\* no package for it on aarch64-darwin. Asked about the shipped pair -- the
\* RELEASE store of `value` followed by the SEQ-CST load of `waiters` -- it
\* returns **Allowed under x86-TSO** (`litmus/grant-bump-vs-waiters-x86.litmus`)
\* and **Forbidden under ARMv8** (`litmus/grant-bump-vs-waiters-aarch64.litmus`).
\* So the abstraction below agrees with the real x86-TSO model on the one case it
\* was built for, and the architectural question is settled by measurement rather
\* than by this file. That agreement is a result, not a licence: this abstraction
\* still must not be quoted for any other pair without its own litmus test.
SPECIFICATION Spec

CONSTANTS
    w1 = w1
    w2 = w2
    Waiters <- WaitersDef
    GrantWork <- GrantWorkDef
    MaxSpurious = 1
    PayloadFirst = TRUE
    AllowStoreLoadReorder = TRUE
    FenceAfterBump = FALSE
    OneOutstandingPerSlot = TRUE

INVARIANTS
    NoLostWakeup

PROPERTIES
    AllServed
