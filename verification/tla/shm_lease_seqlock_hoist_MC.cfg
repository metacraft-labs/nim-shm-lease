\* MUTATION: THE READER'S SECOND SEQ LOAD IS HOISTED ABOVE ITS PAYLOAD LOADS.
\*
\* `ReaderOrdered = FALSE` lets `RSeq2Early` fire at any point during the
\* payload loads, so the reader validates against a counter it read BEFORE the
\* data it is validating. This is the pair MV3 singles out -- "the pair a
\* compiler or a weak model may sink, and the one a hand-written seqlock most
\* often gets wrong" -- and it is the protocol-order shadow of
\* `litmus/seqlock-recheck-vs-payload-RELAXED-control.litmus`.
\*
\* TLC MUST VIOLATE `NoTornRead`. Note what this establishes and what it does
\* not: it shows the retry's CORRECTNESS depends on the second load being
\* ordered after the payload loads, not that any particular compiler or
\* architecture will move it. herd7 answers that, per memory model, and the
\* answers differ -- Allowed under C11 and ARMv8, Forbidden under x86-TSO.
SPECIFICATION Spec

CONSTANTS
    c1 = c1
    c2 = c2
    Readers <- ReadersDef
    PayloadWords = 2
    NumRounds = 3
    WriterOrdered = TRUE
    ReaderChecksParity = TRUE
    ReaderRechecks = TRUE
    ReaderOrdered = FALSE
    WriterWaitsForReaders = FALSE
    SeqModulus = 0

INVARIANTS
    NoTornRead
