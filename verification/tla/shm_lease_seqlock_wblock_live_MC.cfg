\* MUTATION: THE WRITER WAITS FOR IN-FLIGHT READERS -- THE LIVENESS FORM.
\*
\* `WriterWaitsForReaders = TRUE` adds one conjunct to `W0`'s guard: do not
\* start a round while any reader is between its first and second seq loads.
\* It is the shape a reader-writer lock would have, and it is the shape a
\* seqlock exists to avoid.
\*
\* TLC MUST VIOLATE `WriterFinishes`: under `SpecWriterOnly` the readers have
\* NO FAIRNESS, so one of them stops between its two seq loads and never moves
\* again -- descheduled, swapped out, or killed with a snapshot half-taken -- and
\* the writer never publishes another round for anyone. This is the liveness
\* form of `shm_lease_seqlock_wblock_MC.cfg`'s safety violation, and it is the
\* one that says what a reader-writer lock would actually cost here: not a
\* stall, a WEDGE, caused by a client the daemon cannot see or signal.
\*
\* THIS IS WHAT MAKES `shm_lease_seqlock_writeronly_MC.cfg` EVIDENCE. Without
\* it, that configuration is green because nothing in the model could have
\* blocked the writer, and "a writer never blocks on a reader" would be a
\* property of the transcription rather than of the protocol.
SPECIFICATION SpecWriterOnly

CONSTANTS
    c1 = c1
    c2 = c2
    Readers <- ReadersDef
    PayloadWords = 2
    NumRounds = 3
    WriterOrdered = TRUE
    ReaderChecksParity = TRUE
    ReaderRechecks = TRUE
    ReaderOrdered = TRUE
    WriterWaitsForReaders = TRUE
    SeqModulus = 0

PROPERTIES
    WriterFinishes
