\* MUTATION: the fixed claim order is NOT enforced -- `claimWords` accepts p2's
\* descending index list instead of returning `csOutOfOrder`.
\*
\* TLC MUST REPORT A VIOLATION of `NoHoldCycle` (and of `AscendingHold`, which
\* is the local form of the same rule). That violation IS the deadlock argument:
\* the cycle the spec calls "not constructible" is constructed as soon as the
\* ordering rule is dropped.
\*
\* `Termination` is checked here too and is EXPECTED TO HOLD -- see
\* verification/README.md: the cycle does not become a deadlock, because a
\* refused claim rolls back everything it held. The ordering rule and the
\* all-or-nothing rollback are TWO INDEPENDENT guards, and this pair of runs is
\* what separates them.
SPECIFICATION Spec

CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
    Words = {0, 1}
    Base = 4
    Dims = 2
    Capacity <- CapDef
    Want <- WantDef
    WordList <- ListDef
    Rounds = 2
    PerFieldFit = TRUE
    EnforceOrder = FALSE

INVARIANTS
    NoHoldCycle
