\* NON-VACUITY PROBE for the NARROWEST WINDOW IN THE PROTOCOL: a combiner dying
\* BETWEEN the payload store and the value bump. TLC MUST REPORT A VIOLATION.
\*
\* This window is why `WorkPending` tests the VALUE word rather than the payload
\* -- the payload is written and the waiter has been told nothing -- and an
\* earlier draft that tested the payload deadlocked here. Without this probe,
\* nothing would show that the fixed model still reaches the state that broke it.
SPECIFICATION Spec


CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
    Want <- WantDef
    Capacity = 2
    MaxEpochs = 5
    MaxFaults = 1
    IdempotentPublish = TRUE
    BudgetIsCache = TRUE
    SerialisePerSlot = TRUE
    AllowSteal = TRUE
    StealFromLive = FALSE
    AllowStall = TRUE
    CommitFencedByRole = TRUE
    CountOwnProposals = TRUE

INVARIANTS
    ProbeDiedMidPublish
