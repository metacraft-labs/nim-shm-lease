\* NON-VACUITY for the enforced-order configuration: the `csOutOfOrder` refusal
\* must ACTUALLY FIRE on p2's descending list. TLC MUST REPORT A VIOLATION of
\* `ProbeOutOfOrderReached` -- otherwise the green run above would only mean the
\* enforcement was never reached.
SPECIFICATION Spec

CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
    Words = {0, 1}
    Base = 4
    Dims = 2
    Capacity <- CapDef
    Want <- WantDef
    WordList <- ListDef
    Rounds = 2
    PerFieldFit = TRUE
    EnforceOrder = TRUE

INVARIANTS
    ProbeOutOfOrderReached
