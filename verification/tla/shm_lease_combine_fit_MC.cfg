\* MUTATION: THE ROUND'S FIT TEST DOES NOT SEE ITS OWN GRANTS.
\*
\* `CountOwnProposals = FALSE`. This is the most plausible bug in a BULK
\* admission round and it is an easy one to write, because it looks correct: a
\* round's own grants are stamped with an epoch ABOVE `cseq` and are therefore
\* NOT EFFECTIVE YET by the model's own effectiveness rule, so testing fit
\* against "what is effective" is a defensible-sounding thing to do. Every
\* individual decision is then correct against a real state of the budget.
\*
\* TLC MUST REPORT A VIOLATION of `NoOvercommit`: their SUM is not. Two grants
\* of 2 and 1 are both issued against a capacity of 2 and both commit together,
\* which is a memory overcommit -- the OOM this component exists to prevent.
\*
\* The lesson for M5 is a one-liner that is worth stating anyway: a combine
\* round must decide against the effective ledger PLUS its own uncommitted
\* proposals, and "uncommitted" must not be read as "not yet real".
SPECIFICATION Spec

CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
    Want <- WantDef
    Capacity = 2
    MaxEpochs = 5
    MaxFaults = 1
    IdempotentPublish = TRUE
    BudgetIsCache = TRUE
    SerialisePerSlot = TRUE
    AllowSteal = TRUE
    StealFromLive = FALSE
    AllowStall = TRUE
    CommitFencedByRole = TRUE
    CountOwnProposals = FALSE

INVARIANTS
    NoOvercommit
