\* MUTATION: THE BUDGET WORD IS AUTHORITATIVE AND INCREMENTALLY DECREMENTED,
\* which is the obvious implementation and the one M2's claim path already uses.
\* `BudgetIsCache = FALSE`: each grant decrements the budget word as its own
\* step, and there is no recompute.
\*
\* TLC MUST REPORT A VIOLATION of `BudgetExact`: a combiner that decrements and
\* then dies before committing leaves the decrement behind, the stealer discards
\* the round, and THE CAPACITY IS DESTROYED -- withheld from every subsequent
\* action for the lifetime of the segment.
\*
\* This is FINDING 6 in verification/README.md -- that numbering is global, with
\* 1 and 2 being MV1's and 3 to 6 MV2's, and every cross-reference in this
\* directory uses it. A sequence number cannot fix this, because the decrement
\* and the stamp are TWO WORDS and no CAS spans them. The fix is not a bigger stamp,
\* it is to stop treating the budget word as an accumulator: derive it from the
\* stamped per-slot ledger, where "was this applied" is a property of a single
\* atomic word and re-application is a recompute rather than a second subtraction.
SPECIFICATION Spec


CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
    Want <- WantDef
    Capacity = 2
    MaxEpochs = 5
    MaxFaults = 1
    IdempotentPublish = TRUE
    BudgetIsCache = FALSE
    SerialisePerSlot = TRUE
    AllowSteal = TRUE
    StealFromLive = FALSE
    AllowStall = TRUE
    CommitFencedByRole = TRUE
    CountOwnProposals = TRUE

INVARIANTS
    BudgetExact
