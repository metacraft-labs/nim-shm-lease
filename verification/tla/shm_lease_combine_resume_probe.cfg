\* NON-VACUITY PROBE for the FALSE-POSITIVE STEAL specifically, which is the
\* case this whole milestone exists for and therefore the one whose reachability
\* must not be taken on trust. TLC MUST REPORT A VIOLATION, and its
\* counterexample is one behaviour in which a combiner was stolen from, RESUMED
\* onto a round it no longer owned, was FENCED, and a grant was made anyway.
SPECIFICATION Spec


CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
    Want <- WantDef
    Capacity = 2
    MaxEpochs = 5
    MaxFaults = 1
    IdempotentPublish = TRUE
    BudgetIsCache = TRUE
    SerialisePerSlot = TRUE
    AllowSteal = TRUE
    StealFromLive = FALSE
    AllowStall = TRUE
    CommitFencedByRole = TRUE
    CountOwnProposals = TRUE

INVARIANTS
    ProbeResumeReached
