\* NON-VACUITY PROBE -- REQUIRED TO FAIL. The reaper is ever exercised at all:
\* `NeverReaped` must be violated, or every green run above would be a run in
\* which reclamation was never needed and therefore never tested.
SPECIFICATION Spec

CONSTANTS
    s1 = s1
    s2 = s2
    big = big
    NoProc = none
    Smalls <- SmallsDef
    SlotSeq <- SlotSeqDef
    Large = big
    SmallWant = 1
    LargeWant = 3
    Capacity = 4
    MaxHold = 2
    MaxDeaths = 1
    Reserve = TRUE
    ArrivalOrder = TRUE
    Steal = TRUE
    Reclaim = TRUE
    ReclaimLive = FALSE

INVARIANT
    NeverReaped
