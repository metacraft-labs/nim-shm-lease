\* THE FALSE-POSITIVE STEAL, and this is the configuration MV2 exists for.
\*
\* `AllowStall = TRUE`: a combiner may be DESCHEDULED mid-round -- the residual
\* objection the transport spec raises, since a build client holding the role is
\* a large, CPU-hungry process the scheduler is entirely willing to preempt. The
\* steal detector then fires on a process that is NOT DEAD, another process runs
\* a whole round, and `Resume` puts the original combiner back ON THE SAME ROUND
\* with stale locals. Everything it then does is a real step of the protocol.
\*
\* This is strictly harder than death and it is the case a kill-injection suite
\* (M7) structurally cannot reach: SIGKILL never comes back.
SPECIFICATION Spec

CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
    Want <- WantDef
    Capacity = 2
    MaxEpochs = 5
    MaxFaults = 1
    IdempotentPublish = TRUE
    BudgetIsCache = TRUE
    SerialisePerSlot = TRUE
    AllowSteal = TRUE
    StealFromLive = FALSE
    AllowStall = TRUE
    CommitFencedByRole = TRUE
    CountOwnProposals = TRUE

INVARIANTS
    TypeOK
    EpochBoundNotBinding
    NoDoubleGrant
    GrantCoherent
    NoOvercommit
    NonNegative
    BudgetExact
    GrantedEqualsTaken
    StealResolvesExactlyOnce
    NeverBoth
    NoDiscardOfCollected

PROPERTIES
    AllSettled
