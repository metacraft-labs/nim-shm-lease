\* The SAME mutation as `shm_lease_claim_ord_nocheck_MC.cfg` (ordering rule
\* dropped, so the waits-for cycle IS reachable), but with `NoHoldCycle` removed
\* from the invariant list.
\*
\* Everything else must still HOLD, and that is the point: dropping the ordering
\* rule costs the acyclicity of the hold graph and NOTHING ELSE. No overcommit,
\* no lost update, no leaked capacity, and no deadlock -- because the refusal
\* path gives everything back. This is what distinguishes "the ascending rule
\* prevents a cycle" (true, and checked) from "the ascending rule is what
\* prevents a deadlock" (NOT what these runs show; the rollback is).
SPECIFICATION Spec

CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
    Words = {0, 1}
    Base = 4
    Dims = 2
    Capacity <- CapDef
    Want <- WantDef
    WordList <- ListDef
    Rounds = 2
    PerFieldFit = TRUE
    EnforceOrder = FALSE

INVARIANTS
    TypeOK
    NonNegative
    NoBorrow
    NoOvercommit
    ConservationExact
    AllOrNothing
    QuiescentRestore
    ReleasedEqualsClaimed
    CounterIdentityAtQuiescence
    NoOverReleaseRefusal

PROPERTIES
    Termination
