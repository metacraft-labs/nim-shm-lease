\* AN ARBITRARY, FULLY UNSOUND STEAL DETECTOR: `StealFromLive = TRUE` lets the
\* timeout fire on a combiner that is RUNNING, not merely descheduled. Two live
\* processes may then steal the role from each other indefinitely.
\*
\* SAFETY ONLY, and the omissions are the point rather than a convenience:
\*   - `EpochBoundNotBinding` is NOT checked here, because it is FALSE: role
\*     churn under this detector is UNBOUNDED, which is its own finding and has
\*     its own required-to-fail configuration (`*_livelock_MC.cfg`).
\*   - `AllSettled` is NOT checked, for the same reason.
\*   - deadlock checking is disabled (`-deadlock`), because exhausting
\*     `MaxEpochs` leaves states with no successors and that is the bound
\*     talking, not the protocol.
\*
\* What this run establishes is worth having on its own: EVERY SAFETY PROPERTY
\* SURVIVES AN ARBITRARILY WRONG DETECTOR. The epoch stamps fence a wrongly
\* stolen-from combiner out of every mutation, so a bad timeout costs progress
\* and never costs correctness. That is what licenses M7 to choose its timeout
\* by measurement instead of having to prove it never fires early.
SPECIFICATION Spec

CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
    Want <- WantDef
    Capacity = 2
    MaxEpochs = 5
    MaxFaults = 1
    IdempotentPublish = TRUE
    BudgetIsCache = TRUE
    SerialisePerSlot = TRUE
    AllowSteal = TRUE
    StealFromLive = TRUE
    AllowStall = TRUE
    CommitFencedByRole = TRUE
    CountOwnProposals = TRUE

INVARIANTS
    TypeOK
    NoDoubleGrant
    GrantCoherent
    NoOvercommit
    NonNegative
    BudgetExact
    GrantedEqualsTaken
    StealResolvesExactlyOnce
    NeverBoth
    NoDiscardOfCollected
