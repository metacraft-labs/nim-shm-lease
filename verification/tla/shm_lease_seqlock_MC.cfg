\* THE SHIPPED SEQLOCK (MV3, the gate's model). Writer: bump-to-odd, payload
\* stores, bump-to-even. Reader: seq load, parity test, payload loads, seq
\* re-load, retry. Every invariant must HOLD and both liveness properties must
\* hold.
\*
\* The three gate clauses live here as: `NoTornRead` (every value a reader
\* returns is some single writer round's complete payload), `ReaderTerminates`
\* (reader termination under a writer that eventually stops) and
\* `WriterAlwaysEnabled` (a writer never blocks on a reader, as a state
\* predicate at every reachable state). The stronger form of the third --
\* the writer finishing with readers given NO FAIRNESS AT ALL -- is
\* `shm_lease_seqlock_writeronly_MC.cfg`.
SPECIFICATION Spec

CONSTANTS
    c1 = c1
    c2 = c2
    Readers <- ReadersDef
    PayloadWords = 2
    NumRounds = 3
    WriterOrdered = TRUE
    ReaderChecksParity = TRUE
    ReaderRechecks = TRUE
    ReaderOrdered = TRUE
    WriterWaitsForReaders = FALSE
    SeqModulus = 0

INVARIANTS
    TypeOK
    NoTornRead
    WriterAlwaysEnabled
    ReaderAlwaysEnabled
    SeqParityMatchesRound
    AcceptedSeqEven
    AcceptedMatchesCounter

PROPERTIES
    ReaderTerminates
    WriterFinishes
