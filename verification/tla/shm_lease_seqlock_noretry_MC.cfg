\* THE GATE'S REQUIRED-TO-FAIL MODEL CONTROL: THE READER'S RETRY IS REMOVED.
\*
\* `ReaderRechecks = FALSE` deletes `RRetry` and makes `RAccept` unconditional:
\* the reader still performs both seq loads, and simply does not act on the
\* comparison. Everything else is byte-identical to `shm_lease_seqlock_MC.cfg`.
\*
\* TLC MUST VIOLATE `NoTornRead`. MV3's gate says so in as many words, and the
\* reason it says so is that a seqlock without the retry passes every other
\* clause in this file -- the writer still bumps to odd and back to even, the
\* parity test still fires, readers still terminate, the writer still never
\* blocks -- so a tier that did not run this configuration would be reporting the
\* greenness of a structure with its one load-bearing branch deleted.
SPECIFICATION Spec

CONSTANTS
    c1 = c1
    c2 = c2
    Readers <- ReadersDef
    PayloadWords = 2
    NumRounds = 3
    WriterOrdered = TRUE
    ReaderChecksParity = TRUE
    ReaderRechecks = FALSE
    ReaderOrdered = TRUE
    WriterWaitsForReaders = FALSE
    SeqModulus = 0

INVARIANTS
    NoTornRead
