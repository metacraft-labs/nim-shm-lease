\* THE PROBE THAT MATTERS MOST, ON ITS OWN. `ProbeAllReached` conjoins five
\* windows and a reader could in principle reach four of them with the fifth
\* carrying the conjunction; this configuration isolates the load-bearing one.
\*
\* TLC MUST VIOLATE `ProbeRawTornReached`: some reader's own payload loads
\* straddle a writer round, so the snapshot it holds at validation time belongs
\* to no single round. That is the state `NoTornRead` is green DESPITE, and if
\* it is unreachable then `shm_lease_seqlock_MC.cfg` is green because the
\* structure was never exercised rather than because the retry works.
SPECIFICATION Spec

CONSTANTS
    c1 = c1
    c2 = c2
    Readers <- ReadersDef
    PayloadWords = 2
    NumRounds = 3
    WriterOrdered = TRUE
    ReaderChecksParity = TRUE
    ReaderRechecks = TRUE
    ReaderOrdered = TRUE
    WriterWaitsForReaders = FALSE
    SeqModulus = 0

INVARIANTS
    ProbeRawTornReached
