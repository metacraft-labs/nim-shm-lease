\* MUTATION: THE COMMIT IS NOT FENCED BY THE ROLE WORD.
\*
\* `CommitFencedByRole = FALSE`: the commit is a monotone store on the SEPARATE
\* combine-sequence word and the role word is only a lock -- the natural reading
\* of "LhOffReserved2 is the combiner role word, LhOffReserved3 is the combine
\* sequence", and the design an implementer would write from that sentence alone.
\*
\* NOTE THAT THE DISCARD *READ* IS TOGGLED TOO, and it has to be: with the commit
\* bit gone, `PrevRoundUnresolved` becomes `role.epoch > cseq`, which is the test
\* an implementer of THIS design would write because it is the only one the
\* design gives them. Deleting the write while leaving the read would make the
\* bit permanently FALSE and label every acquisition over a decided round
\* "discarded", including rounds that committed cleanly -- a mislabelling, not a
\* protocol defect. See `PrevRoundUnresolved` in the model.
\*
\* TLC MUST REPORT A VIOLATION of `NeverBoth`, in REAL state: a combiner is
\* descheduled at `cCommit` holding epoch 1 with `cseq = 0`; the stealer takes
\* the role at epoch 2 and DISCARDS round 1; the original resumes and stores
\* `cseq := 1`, because nothing the steal touched is anything its commit reads.
\* Round 1's grant -- an entry of a round the stealer declared discarded -- is now
\* EFFECTIVE. The round is half applied and half thrown away: both, where the
\* gate demands exactly one.
\*
\* This is FINDING 4 in verification/README.md, and the fix is structural: the
\* commit and the role transfer MUST be resolved by ONE CAS on ONE word, so that
\* the CAS which transfers the role is the same CAS that invalidates the previous
\* owner's commit. Putting the commit flag inside `LhOffReserved2` is one way;
\* see the finding for what the evidence does and does not establish, including
\* `shm_lease_combine_unfenced_damage_MC.cfg`, which runs these same constants
\* against every NON-GHOST invariant and is GREEN.
SPECIFICATION Spec


CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
