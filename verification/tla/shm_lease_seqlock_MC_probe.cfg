\* NON-VACUITY PROBE for the shipped seqlock. Identical constants to
\* `shm_lease_seqlock_MC.cfg`; only the invariant differs, and TLC MUST REPORT A
\* VIOLATION. The counterexample is ONE behaviour in which a reader caught the
\* counter ODD and retried, AND a reader retried because the SECOND seq load
\* disagreed with the first, AND some reader's raw snapshot was genuinely TORN
\* before validation, AND a payload word was loaded while a round was in flight,
\* AND a reader nevertheless finished.
\*
\* A green run here would mean the shipped configuration's `NoTornRead` is green
\* because nothing ever tore -- the exact way a model is edited into vacuity.
SPECIFICATION Spec

CONSTANTS
    c1 = c1
    c2 = c2
    Readers <- ReadersDef
    PayloadWords = 2
    NumRounds = 3
    WriterOrdered = TRUE
    ReaderChecksParity = TRUE
    ReaderRechecks = TRUE
    ReaderOrdered = TRUE
    WriterWaitsForReaders = FALSE
    SeqModulus = 0

INVARIANTS
    ProbeAllReached
