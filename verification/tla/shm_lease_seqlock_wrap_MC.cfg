\* FINDING (MV3): THE COUNTER MUST NOT WRAP UNDER A READER, AND THE STRUCTURES
\* SPEC DOES NOT SAY SO.
\*
\* `SeqModulus = 4` is a two-bit counter -- even, so the even-odd discipline
\* survives the wrap and the parity test still works exactly as specified. The
\* protocol is otherwise UNCHANGED from `shm_lease_seqlock_MC.cfg`: the writer
\* bumps to odd, stores, bumps to even; the reader loads, tests parity, loads
\* the payload, re-loads and compares. Nothing is deleted and nothing is
\* reordered.
\*
\* TLC MUST VIOLATE `NoTornRead`. The counterexample is the seqlock's ABA: a
\* reader reads the counter, is descheduled, TWO complete rounds run and bring
\* the counter back to the value it read, and the comparison it performs on
\* resuming therefore proves nothing. `s2 = s1` is evidence of stability ONLY
\* because the counter cannot return to a value it has left, and that premise is
\* a WIDTH requirement rather than a protocol rule.
\*
\* WHAT THIS DOES AND DOES NOT MEAN FOR M13b: at 32 or 64 bits the wrap is not
\* reachable in any real deployment and this control is a statement about the
\* argument rather than about the code. It becomes reachable the moment the
\* counter is NARROWED -- packed into a header field beside a key hash or a
\* generation, which is exactly the kind of change a fixed-size-entry table
\* invites. See verification/README.md, Finding 7.
SPECIFICATION Spec

CONSTANTS
    c1 = c1
    c2 = c2
    Readers <- ReadersDef
    PayloadWords = 2
    NumRounds = 2
    WriterOrdered = TRUE
    ReaderChecksParity = TRUE
    ReaderRechecks = TRUE
    ReaderOrdered = TRUE
    WriterWaitsForReaders = FALSE
    SeqModulus = 4

INVARIANTS
    NoTornRead
