\* SHIPPED: the fixed claim order is ENFORCED (`csOutOfOrder`). p2's descending
\* index list is refused and p2 therefore never holds a word, so no cycle in the
\* waits-for relation is reachable. Every invariant here must HOLD.
SPECIFICATION Spec

CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
    Words = {0, 1}
    Base = 4
    Dims = 2
    Capacity <- CapDef
    Want <- WantDef
    WordList <- ListDef
    Rounds = 2
    PerFieldFit = TRUE
    EnforceOrder = TRUE

INVARIANTS
    TypeOK
    NonNegative
    NoBorrow
    NoOvercommit
    ConservationExact
    AllOrNothing
    QuiescentRestore
    ReleasedEqualsClaimed
    CounterIdentityAtQuiescence
    NoOverReleaseRefusal
    AscendingHold
    NoHoldCycle

PROPERTIES
    Termination
