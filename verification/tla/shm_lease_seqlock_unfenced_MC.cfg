\* MUTATION: THE PUBLISHING BUMP HAPPENS BEFORE THE PAYLOAD STORES.
\*
\* `WriterOrdered = FALSE` moves the bump back to EVEN ahead of the payload
\* writes, so the counter announces a stable entry while the entry is still
\* being written. This is the PROTOCOL-ORDER form of "the publishing store was
\* not a release store" -- the model's counterpart of
\* `litmus/seqlock-publish-vs-read-RELAXED-control.litmus`, and it must not be
\* mistaken for the memory-model statement, which is herd7's.
\*
\* TLC MUST VIOLATE `NoTornRead`: a reader reads an even counter, loads one new
\* word and one old one, re-reads the same even counter and accepts.
\*
\* `SeqParityMatchesRound` is deliberately NOT listed: this mutation breaks the
\* even-odd discipline by construction, so listing it would let the
\* configuration "fail" for a reason that is not the one being demonstrated.
SPECIFICATION Spec

CONSTANTS
    c1 = c1
    c2 = c2
    Readers <- ReadersDef
    PayloadWords = 2
    NumRounds = 3
    WriterOrdered = FALSE
    ReaderChecksParity = TRUE
    ReaderRechecks = TRUE
    ReaderOrdered = TRUE
    WriterWaitsForReaders = FALSE
    SeqModulus = 0

INVARIANTS
    NoTornRead
