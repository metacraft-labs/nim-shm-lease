\* NON-VACUITY PROBE -- REQUIRED TO FAIL, and it is what makes the green run
\* above evidence that capacity is HELD IDLE rather than merely that a large
\* claim eventually got in.
\*
\* `NeverBlocked` says no round ever refused a request that WOULD have fitted the
\* capacity genuinely free. Under the shipping policy that must be FALSE: the
\* reservation has to cost somebody something, or it was never exercised. TLC
\* must report an invariant violation on `NeverBlocked`.
SPECIFICATION Spec

CONSTANTS
    s1 = s1
    s2 = s2
    big = big
    Smalls <- SmallsDef
    SlotSeq <- SlotSeqDef
    Large = big
    SmallWant = 1
    LargeWant = 3
    Capacity = 4
    MaxHold = 2
    Reserve = TRUE
    ArrivalOrder = TRUE

INVARIANT
    NeverBlocked
