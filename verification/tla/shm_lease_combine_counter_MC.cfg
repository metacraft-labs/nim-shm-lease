\* MUTATION -- AND IT IS THE MUTATION THAT ANSWERS MV1's OPEN QUESTION.
\*
\* `IdempotentPublish = FALSE`: the published value is a BARE COUNTER BUMP, which
\* is exactly what `publishGrant` does today (`wire.val := wire.val + 1`), rather
\* than the round's epoch. A stealer completing a committed round then CANNOT
\* TELL whether the dead combiner already published, and republishing bumps the
\* counter a second time.
\*
\* TLC MUST REPORT A VIOLATION of `NoDoubleGrant`: ONE GRANT IS DELIVERED TWICE.
\*
\* Serialisation per slot does NOT prevent this and cannot: the stealer's
\* question is not "may I grant?" but "did the corpse already publish?", and only
\* a sequence number carried in the published value answers it. This is the half
\* of MV1's either/or that serialisation alone leaves broken.
SPECIFICATION Spec


CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
    Want <- WantDef
    Capacity = 2
    MaxEpochs = 5
    MaxFaults = 1
    IdempotentPublish = FALSE
    BudgetIsCache = TRUE
    SerialisePerSlot = TRUE
    AllowSteal = TRUE
    StealFromLive = FALSE
    AllowStall = TRUE
    CommitFencedByRole = TRUE
    CountOwnProposals = TRUE

INVARIANTS
    NoDoubleGrant
