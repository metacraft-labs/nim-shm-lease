\* M7 GREEN: THE RESERVATION AND THE COMBINE PROTOCOL TOGETHER, WITH DEATH.
\*
\* Every safety invariant holds -- including the two that are ABOUT reclamation
\* rather than about admission: nothing a LIVE process holds is ever taken away
\* from it (`NoLiveReclaim`), and what is genuinely being consumed never exceeds
\* the machine (`NoOvercommitReal`).
\*
\* And all three liveness properties hold WITH A DEATH IN EVERY BEHAVIOUR that
\* wants one: the large claim is still eventually admitted (SM-4 survives a
\* combiner dying mid-round while a reservation stands, because the role is
\* stolen), small claims keep being served, and the ledger always eventually
\* agrees with reality again (SM-6 -- no permanently leaked capacity).
SPECIFICATION Spec

CONSTANTS
    s1 = s1
    s2 = s2
    big = big
    NoProc = none
    Smalls <- SmallsDef
    SlotSeq <- SlotSeqDef
    Large = big
    SmallWant = 1
    LargeWant = 3
    Capacity = 4
    MaxHold = 2
    MaxDeaths = 1
    Reserve = TRUE
    ArrivalOrder = TRUE
    Steal = TRUE
    Reclaim = TRUE
    ReclaimLive = FALSE

INVARIANTS
    TypeOK
    NoOvercommitLedger
    NoOvercommitReal
    NoLiveReclaim
    QueueIsPending
    RoleCoherent

PROPERTIES
    LargeAdmitted
    SmallsKeepGoing
    NoLeakedCapacity
