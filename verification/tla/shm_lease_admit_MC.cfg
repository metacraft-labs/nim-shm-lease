\* THE SHIPPED M6 POLICY: arrival order AND a single reservation head.
\*
\* Every safety invariant holds, the large claim is EVENTUALLY ADMITTED under a
\* storm that never stops asking, and the small claims keep being served
\* infinitely often — so the cure is not permanent underutilization.
SPECIFICATION Spec

CONSTANTS
    s1 = s1
    s2 = s2
    big = big
    Smalls <- SmallsDef
    SlotSeq <- SlotSeqDef
    Large = big
    SmallWant = 1
    LargeWant = 3
    Capacity = 4
    MaxHold = 2
    Reserve = TRUE
    ArrivalOrder = TRUE

INVARIANTS
    TypeOK
    NoOvercommit
    QueueIsPending

PROPERTIES
    LargeAdmitted
    SmallsKeepGoing
