\* NON-VACUITY PROBE for the shipped combiner. Identical constants to
\* `shm_lease_combine_f2_MC.cfg`; only the invariant differs, and TLC MUST
\* REPORT A VIOLATION. The counterexample is a single behaviour in which a role
\* was acquired cleanly AND stolen, a combiner DIED MID-ROUND, an uncommitted
\* round was DISCARDED, a committed round was COMPLETED BY A DIFFERENT PROCESS
\* than the one that committed it, a request was GRANTED, another was REFUSED,
\* and a stale combiner was FENCED out of the round it thought it owned.
\*
\* A green run here would mean the green runs above never reached the states
\* their invariants are about, which is the failure mode a model checker is
\* easiest to fool by.
SPECIFICATION Spec


CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
    Want <- WantDef
    Capacity = 2
    MaxEpochs = 5
    MaxFaults = 2
    IdempotentPublish = TRUE
    BudgetIsCache = TRUE
    SerialisePerSlot = TRUE
    AllowSteal = TRUE
    StealFromLive = FALSE
    AllowStall = TRUE
    CommitFencedByRole = TRUE
    CountOwnProposals = TRUE

INVARIANTS
    ProbeAllReached
