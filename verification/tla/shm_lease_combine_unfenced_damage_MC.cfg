\* FINDING 4's SECOND HALF, AND IT IS A GREEN RUN ON A MUTATION -- which is an
\* unusual thing to want, so read why.
\*
\* `shm_lease_combine_unfenced_MC.cfg` runs the SAME constants and is REQUIRED to
\* violate `NeverBoth`: with the commit unfenced by the role word, a round is both
\* discarded by a stealer and committed afterwards by the process that was stolen
\* from. That is a real defect in real state -- the stolen-from combiner's grant
\* becomes EFFECTIVE after the stealer declared its round discarded.
\*
\* This configuration asks the OTHER question, the one the finding must not
\* overstate: does that half-applied round go on to DAMAGE anything? It runs the
\* same mutation against EVERY NON-GHOST invariant -- no `NeverBoth`, no
\* `StealResolvesExactlyOnce`, so nothing here is stated over the `eres`/`edisc`
\* ghosts -- plus `AllSettled`.
\*
\* IT IS GREEN, and that is the honest boundary of Finding 4: no capacity is
\* conjured or destroyed, no request is granted twice, no waiter reads an
\* incoherent payload, nothing is stranded. The per-step re-evaluated raise guard
\* (`RaiseNeeded` is recomputed against the CURRENT ledger at every step, so an
\* entry that becomes effective mid-pass is no longer raised) and `SerialisePerSlot`
\* between them absorb the hazard. So the mutation is a violation of the
\* "exactly once" clause of the gate and NOT of its damage clauses, and Finding 4
\* is stated at that precision rather than as "half applied, half discarded, and
\* therefore corrupt".
\*
\* Two faults, so the round that recovers may itself be abandoned -- the same
\* bound as `*_f2_MC.cfg`, which is the strongest fault budget any green run here
\* uses.
SPECIFICATION Spec

CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
    Want <- WantDef
    Capacity = 2
    MaxEpochs = 5
    MaxFaults = 2
    IdempotentPublish = TRUE
    BudgetIsCache = TRUE
    SerialisePerSlot = TRUE
    AllowSteal = TRUE
    StealFromLive = FALSE
    AllowStall = TRUE
    CommitFencedByRole = FALSE
    CountOwnProposals = TRUE

INVARIANTS
    TypeOK
    EpochBoundNotBinding
    NoDoubleGrant
    GrantCoherent
    NoOvercommit
    NonNegative
    BudgetExact
    GrantedEqualsTaken
    NoDiscardOfCollected

PROPERTIES
    AllSettled
