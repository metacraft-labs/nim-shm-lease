\* MUTATION -- REQUIRED TO FAIL. THE MIRROR IMAGE: RECLAIMING A LIVE HOLDER.
\*
\* This is the failure direction that is WORSE than a slow reclaim, and the reason
\* the anchor check is the safety half of the rule rather than an optimisation. A
\* reclamation that fires on a process which is alive and still consuming clears
\* the ledger entry, the capacity is handed to somebody else, and both are using
\* it: `NoLiveReclaim` and `NoOvercommitReal` are both violated while
\* `NoOvercommitLedger` -- the invariant a naive implementation would check --
\* stays happily true.
SPECIFICATION Spec

CONSTANTS
    s1 = s1
    s2 = s2
    big = big
    NoProc = none
    Smalls <- SmallsDef
    SlotSeq <- SlotSeqDef
    Large = big
    SmallWant = 1
    LargeWant = 3
    Capacity = 4
    MaxHold = 2
    MaxDeaths = 1
    Reserve = TRUE
    ArrivalOrder = TRUE
    Steal = TRUE
    Reclaim = TRUE
    ReclaimLive = TRUE

INVARIANTS
    TypeOK
    NoOvercommitLedger
    NoOvercommitReal
    NoLiveReclaim
    QueueIsPending
    RoleCoherent
