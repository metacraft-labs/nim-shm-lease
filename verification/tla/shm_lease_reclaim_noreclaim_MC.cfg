\* MUTATION -- REQUIRED TO FAIL. SM-6 WITH NO REAPER.
\*
\* The steal still works, so nothing DEADLOCKS: rounds keep running and small
\* claims keep being granted. What fails is the thing SM-6 is separate from SM-5
\* for -- a dead claimer's grant stays in the ledger forever, the machine is
\* permanently smaller by that much, and the large claim can never fit again.
\*
\* TLC must report a temporal-property violation. Safety is still checked, because
\* a control that starved the large claim by overcommitting would prove nothing.
\*
\* RUN WITH `-deadlock`, AND THE REASON IS STATED RATHER THAN CONVENIENT: with the
\* recovery mechanism switched off the system genuinely reaches states with NO
\* SUCCESSOR -- every live process is holding all it may hold, nothing can be
\* decided, and nothing is enabled. That IS the wedge, and TLC would report it as
\* `Deadlock reached` at depth 9 and stop there. Disabling the deadlock check lets
\* the run continue to the temporal check, so the reported failure NAMES the
\* property that was lost instead of naming a symptom.
SPECIFICATION Spec

CONSTANTS
    s1 = s1
    s2 = s2
    big = big
    NoProc = none
    Smalls <- SmallsDef
    SlotSeq <- SlotSeqDef
    Large = big
    SmallWant = 1
    LargeWant = 3
    Capacity = 4
    MaxHold = 2
    MaxDeaths = 1
    Reserve = TRUE
    ArrivalOrder = TRUE
    Steal = TRUE
    Reclaim = FALSE
    ReclaimLive = FALSE

INVARIANTS
    TypeOK
    NoOvercommitLedger
    NoOvercommitReal
    NoLiveReclaim
    QueueIsPending
    RoleCoherent

PROPERTIES
    LargeAdmitted
    NoLeakedCapacity
