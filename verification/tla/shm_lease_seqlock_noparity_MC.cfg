\* MUTATION: THE READER DROPS THE ODD TEST AND KEEPS THE COMPARISON.
\*
\* This is the plausible-looking simplification -- "if the two loads agree the
\* entry was stable, so why test parity as well?" -- and it is wrong: a reader
\* that starts inside a round reads an ODD counter, loads a half-written entry,
\* re-reads the SAME odd counter because the writer has not finished, finds them
\* equal and accepts.
\*
\* TLC MUST VIOLATE `NoTornRead`. It is worth having as a separate control from
\* `noretry` because the two branches of the reader's validation fail
\* independently, and a `noretry`-only tier would leave the impression that the
\* comparison alone is what buys the property.
SPECIFICATION Spec

CONSTANTS
    c1 = c1
    c2 = c2
    Readers <- ReadersDef
    PayloadWords = 2
    NumRounds = 3
    WriterOrdered = TRUE
    ReaderChecksParity = FALSE
    ReaderRechecks = TRUE
    ReaderOrdered = TRUE
    WriterWaitsForReaders = FALSE
    SeqModulus = 0

INVARIANTS
    NoTornRead
