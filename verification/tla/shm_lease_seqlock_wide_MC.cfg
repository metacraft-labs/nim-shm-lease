\* THE SAME PROTOCOL WITH A WIDER ENTRY: THREE payload words instead of two.
\*
\* Its point is that `NoTornRead` is not an artefact of a two-word entry. A
\* three-word entry has a tear shape the two-word one does not -- first and last
\* word from the new round with the middle word from the old, which a reader
\* that validated only the first and last words would accept -- so the widening
\* is a real question rather than a bigger number. The published aggregate table
\* carries several counters per key, so the shipped entry is wider than two.
SPECIFICATION Spec

CONSTANTS
    c1 = c1
    c2 = c2
    Readers <- ReadersDef
    PayloadWords = 3
    NumRounds = 2
    WriterOrdered = TRUE
    ReaderChecksParity = TRUE
    ReaderRechecks = TRUE
    ReaderOrdered = TRUE
    WriterWaitsForReaders = FALSE
    SeqModulus = 0

INVARIANTS
    TypeOK
    NoTornRead
    WriterAlwaysEnabled
    ReaderAlwaysEnabled
    SeqParityMatchesRound
    AcceptedSeqEven
    AcceptedMatchesCounter

PROPERTIES
    ReaderTerminates
    WriterFinishes
