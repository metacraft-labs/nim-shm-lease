\* MUTATION -- AND IT IS THE OTHER HALF OF MV1's OPEN QUESTION.
\*
\* `SerialisePerSlot = FALSE`: the round clears the board and re-decides every
\* pending request, including one whose grant is already committed -- whether its
\* waiter has collected it or not.
\*
\* TLC MUST REPORT A VIOLATION of `NoDoubleGrant`, and it is worth being exact
\* about WHICH of the two damaged cases that invariant witnesses, because they
\* are different and only one of them is a double grant:
\*
\*  - RE-GRANT OF AN ALREADY-COLLECTED REQUEST (`NoDoubleGrant`, 32-state
\*    trace): the waiter reads its grant, the next round re-decides the slot and
\*    grants it AGAIN, and the waiter collects a SECOND grant for one request.
\*
\*  - OVERWRITE OF AN UNCOLLECTED FIRST GRANT: this one CANNOT violate
\*    `NoDoubleGrant` -- a waiter that never read the first collects exactly once.
\*    It is witnessed by `GrantCoherent` (29-state trace: the waiter observed
\*    value v and reads a payload published for a later round), and the erasure
\*    behind an already-acting waiter is witnessed by `NoDiscardOfCollected` and
\*    `GrantedEqualsTaken` (20 states each).
\*
\* A sequence number does NOT prevent either and cannot: the payload is ONE WORD,
\* and no stamp recovers a word that has been overwritten. It makes the loss
\* DETECTABLE, not survivable. This is the half of MV1's either/or that a
\* sequence number alone leaves broken -- so the answer to "serialise or
\* sequence?" is BOTH, and each mutation here is the proof that the other
\* mechanism does not cover for it.
SPECIFICATION Spec


CONSTANTS
    p1 = p1
    p2 = p2
    Procs <- ProcsDef
    Want <- WantDef
    Capacity = 2
    MaxEpochs = 5
    MaxFaults = 1
    IdempotentPublish = TRUE
    BudgetIsCache = TRUE
    SerialisePerSlot = FALSE
    AllowSteal = TRUE
    StealFromLive = FALSE
    AllowStall = TRUE
    CommitFencedByRole = TRUE
    CountOwnProposals = TRUE

INVARIANTS
    NoDoubleGrant
