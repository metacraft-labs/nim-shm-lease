\* MUTATION: THE WRITER WAITS FOR IN-FLIGHT READERS.
\*
\* `WriterWaitsForReaders = TRUE` adds one conjunct to `W0`'s guard: do not
\* start a round while any reader is between its first and second seq loads.
\* It is the shape a reader-writer lock would have, and it is the shape a
\* seqlock exists to avoid.
\*
\* TLC MUST VIOLATE `WriterAlwaysEnabled`: a reader between its two seq loads
\* puts the writer into a state where it has no step to take. This is the
\* SAFETY form and it falls out in 24 states. The LIVENESS form -- the writer
\* never publishing again -- is `shm_lease_seqlock_wblock_live_MC.cfg`, split
\* out because a temporal property costs a full exploration and because "the
\* writer can be blocked for an instant" and "the writer can be blocked
\* forever" are two different claims and this tier states both.
\*
\* THIS IS WHAT MAKES `shm_lease_seqlock_writeronly_MC.cfg` EVIDENCE. Without
\* it, that configuration is green because nothing in the model could have
\* blocked the writer, and "a writer never blocks on a reader" would be a
\* property of the transcription rather than of the protocol.
SPECIFICATION SpecWriterOnly

CONSTANTS
    c1 = c1
    c2 = c2
    Readers <- ReadersDef
    PayloadWords = 2
    NumRounds = 3
    WriterOrdered = TRUE
    ReaderChecksParity = TRUE
    ReaderRechecks = TRUE
    ReaderOrdered = TRUE
    WriterWaitsForReaders = TRUE
    SeqModulus = 0

INVARIANTS
    WriterAlwaysEnabled
