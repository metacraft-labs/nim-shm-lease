\* MUTATION -- REQUIRED TO FAIL. M5's POLICY EXACTLY: slot order, no reservation. This is the naive first-come-if-it-fits admission the transport spec says starves large claims.
\*
\* SAFETY IS STILL CHECKED HERE, deliberately: a control that starved the large
\* claim by overcommitting would prove nothing, so the mutations are held to the
\* same safety bar as the shipping policy. What must break is LIVENESS, and only
\* liveness: TLC must report a temporal-property violation on `LargeAdmitted`.
SPECIFICATION Spec

CONSTANTS
    s1 = s1
    s2 = s2
    big = big
    Smalls <- SmallsDef
    SlotSeq <- SlotSeqDef
    Large = big
    SmallWant = 1
    LargeWant = 3
    Capacity = 4
    MaxHold = 2
    Reserve = FALSE
    ArrivalOrder = FALSE

INVARIANTS
    TypeOK
    NoOvercommit
    QueueIsPending

PROPERTIES
    LargeAdmitted
