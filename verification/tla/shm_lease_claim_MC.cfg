\* THE SHIPPED CLAIM PROTOCOL (MV1 gate item (a)). Every invariant here must
\* HOLD, and `Termination` is the deadlock/livelock-freedom half.
SPECIFICATION Spec

CONSTANTS
    p1 = p1
    p2 = p2
    p3 = p3
    Procs <- ProcsDef
    Words = {0, 1}
    Base = 4
    Dims = 2
    Capacity <- CapDef
    Want <- WantDef
    WordList <- ListDef
    Rounds = 2
    PerFieldFit = TRUE
    EnforceOrder = TRUE

INVARIANTS
    TypeOK
    NonNegative
    NoBorrow
    NoOvercommit
    ConservationExact
    AllOrNothing
    QuiescentRestore
    ReleasedEqualsClaimed
    CounterIdentityAtQuiescence
    NoOverReleaseRefusal
    AscendingHold
    NoHoldCycle

PROPERTIES
    Termination
