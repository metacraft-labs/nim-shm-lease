\* MUTATION -- REQUIRED TO FAIL. SM-5 WITH NO STEAL PROTOCOL.
\*
\* A combiner that dies mid-round KEEPS THE ROLE, so no other process can ever run
\* a round. This is the interaction M6 recorded as checked by NEITHER model: the
\* dead combiner's round had named a reservation head, so capacity is held idle
\* for a request that will never be decided, by a process that will never run
\* again. Admission stops for everybody.
\*
\* TLC must report a temporal-property violation on `LargeAdmitted`.
\*
\* RUN WITH `-deadlock`, AND THE REASON IS STATED RATHER THAN CONVENIENT: with the
\* recovery mechanism switched off the system genuinely reaches states with NO
\* SUCCESSOR -- every live process is holding all it may hold, nothing can be
\* decided, and nothing is enabled. That IS the wedge, and TLC would report it as
\* `Deadlock reached` at depth 9 and stop there. Disabling the deadlock check lets
\* the run continue to the temporal check, so the reported failure NAMES the
\* property that was lost instead of naming a symptom.
SPECIFICATION Spec

