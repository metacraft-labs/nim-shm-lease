    s1 = s1
    s2 = s2
    big = big
    NoProc = none
    Smalls <- SmallsDef
    SlotSeq <- SlotSeqDef
    Large = big
    SmallWant = 1
    LargeWant = 3
    Capacity = 4
    MaxHold = 2
    MaxDeaths = 1
    Reserve = TRUE
    ArrivalOrder = TRUE
    Steal = FALSE
    Reclaim = TRUE
    ReclaimLive = FALSE

INVARIANTS
    TypeOK
    NoOvercommitLedger
    NoOvercommitReal
    NoLiveReclaim
    QueueIsPending
    RoleCoherent

PROPERTIES
    LargeAdmitted
