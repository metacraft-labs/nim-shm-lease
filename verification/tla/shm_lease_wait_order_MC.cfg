\* MUTATION -- THE GRANT-THEN-WAKE PUBLISH ORDER INVERTED: the value is bumped
\* BEFORE the payload is written, instead of after.
\*
\* TLC MUST REPORT A VIOLATION of `GrantPayloadCoherent`. No weak memory is
\* involved: the waiter simply runs between the bump and the payload store,
\* observes its word has moved, and reads the PREVIOUS grant. This is why the
\* spec calls the publish order "the whole protocol, and not incidental".
SPECIFICATION Spec

CONSTANTS
    w1 = w1
    w2 = w2
    Waiters <- WaitersDef
    GrantWork <- GrantWorkDef
    MaxSpurious = 1
    PayloadFirst = FALSE
    AllowStoreLoadReorder = FALSE
    FenceAfterBump = FALSE
    OneOutstandingPerSlot = TRUE

INVARIANTS
    GrantPayloadCoherent
