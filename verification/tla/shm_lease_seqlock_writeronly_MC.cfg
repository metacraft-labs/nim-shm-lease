\* A WRITER NEVER BLOCKS ON A READER, in its strong form: `SpecWriterOnly`
\* gives weak fairness to the WRITER ONLY. The readers are given NO FAIRNESS AT
\* ALL, so TLC must consider behaviours in which a reader takes one step and
\* then never takes another for the rest of time -- descheduled between its two
\* seq loads, swapped out, stopped in a debugger, or killed with a snapshot
\* half-taken. `WriterFinishes` must still hold.
\*
\* This is the same device `shm_lease_wait.tla` uses to withhold fairness from
\* `SpuriousWake`: refusing fairness is how you state that nothing may depend on
\* the other party moving. `shm_lease_seqlock_wblock_MC.cfg` is the mutation
\* that introduces the dependency, and it is REQUIRED to break this property --
\* which is what keeps this configuration from being green for free.
SPECIFICATION SpecWriterOnly

CONSTANTS
    c1 = c1
    c2 = c2
    Readers <- ReadersDef
    PayloadWords = 2
    NumRounds = 3
    WriterOrdered = TRUE
    ReaderChecksParity = TRUE
    ReaderRechecks = TRUE
    ReaderOrdered = TRUE
    WriterWaitsForReaders = FALSE
    SeqModulus = 0

INVARIANTS
    TypeOK
    NoTornRead
    WriterAlwaysEnabled

PROPERTIES
    WriterFinishes
