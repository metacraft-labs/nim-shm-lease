\* THE PRECONDITION DROPPED: `publishGrant` called twice on one slot before that
\* slot's waiter has collected the first grant.
\*
\* TLC MUST REPORT A VIOLATION of `GrantPayloadCoherent`, and this one is a REAL
\* DEFECT IN THE CONTRACT rather than an injected mutation -- nothing in the API,
\* the docstrings or the spec states the precondition. The payload is a single
\* word and the value is a plain counter, so the second grant OVERWRITES the
\* first and the waiter cannot tell: it acknowledges value v while holding grant
\* v+1's payload. See verification/README.md and MV1's :result: -- this is a
\* direct constraint on M5's arbiter and therefore on MV2.
SPECIFICATION Spec

CONSTANTS
    w1 = w1
    w2 = w2
    Waiters <- WaitersDef
    GrantWork <- GrantWorkDef
    MaxSpurious = 1
    PayloadFirst = TRUE
    AllowStoreLoadReorder = FALSE
    FenceAfterBump = FALSE
