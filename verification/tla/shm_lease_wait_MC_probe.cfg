\* NON-VACUITY PROBE for the shipped wait configuration. Identical constants to
\* `shm_lease_wait_MC.cfg`; only the invariant differs, and TLC MUST REPORT A
\* VIOLATION. The counterexample is a single behaviour containing all EIGHT
\* windows the protocol is made of -- see `ProbeAllReached` in shm_lease_wait.tla.
\* A green run here would mean the shipped run above never reached the states its
\* invariants are about.
SPECIFICATION Spec

CONSTANTS
    w1 = w1
    w2 = w2
    Waiters <- WaitersDef
    GrantWork <- GrantWorkDef
    MaxSpurious = 1
    PayloadFirst = TRUE
    AllowStoreLoadReorder = FALSE
    FenceAfterBump = FALSE
    OneOutstandingPerSlot = TRUE

INVARIANTS
    ProbeAllReached
