\* NON-VACUITY PROBE for the shipped claim configuration. Identical constants to
\* `shm_lease_claim_MC.cfg`; the only change is the invariant, which is the
\* NEGATION of "all four interesting behaviours have happened".
\*
\* TLC MUST REPORT A VIOLATION HERE. The counterexample is one behaviour in
\* which a claim was REFUSED, a partial claim was ROLLED BACK, a CAS was LOST to
\* a competing process, and a multi-word claim was GRANTED. A green run would
\* mean the workload never reaches those states and that the green run of
\* `shm_lease_claim_MC.cfg` proved nothing.
SPECIFICATION Spec

CONSTANTS
    p1 = p1
    p2 = p2
    p3 = p3
    Procs <- ProcsDef
    Words = {0, 1}
    Base = 4
    Dims = 2
    Capacity <- CapDef
    Want <- WantDef
    WordList <- ListDef
    Rounds = 2
    PerFieldFit = TRUE
    EnforceOrder = TRUE

INVARIANTS
    ProbeAllReached
